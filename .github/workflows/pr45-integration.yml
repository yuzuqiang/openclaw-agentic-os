name: PR45 package-scope exact-commit verification
on:
  push:
    branches: [fix/pr45-integration-c5d7a1d]
    paths: [.github/workflows/pr45-integration.yml]
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Capture current integration sources and exact published candidate
        run: |
          mkdir -p "$RUNNER_TEMP/scope-full-artifact" "$RUNNER_TEMP/integration-sources"
          python - <<'PY'
          import json, os, pathlib, subprocess
          temp = pathlib.Path(os.environ['RUNNER_TEMP'])
          all_refs = subprocess.check_output(['git','for-each-ref','--format=%(refname)','refs/remotes/origin'],text=True).splitlines()
          refs = [r for r in all_refs if r.startswith('refs/remotes/origin/fix/pr45-') or r in {'refs/remotes/origin/main','refs/remotes/origin/phase-b/issue44-live-runtime-readiness-20260824'}]
          subprocess.run(['git','bundle','create',str(temp/'integration-sources/current-candidates.bundle'),*refs],check=True)
          (temp/'integration-sources/refs.json').write_text(json.dumps({r:subprocess.check_output(['git','rev-parse',r],text=True).strip() for r in refs},indent=2))
          candidate = temp/'scope-candidate'
          head = 'c0cc9d28490657157a9d1cd12675dcc73cd84a2f'
          tree = '5047ea5f43bef41efd0c5a9727d1cf8392bac796'
          subprocess.run(['git','worktree','add','--detach',str(candidate),head],check=True)
          assert subprocess.check_output(['git','rev-parse','HEAD'],cwd=candidate,text=True).strip() == head
          assert subprocess.check_output(['git','rev-parse','HEAD^{tree}'],cwd=candidate,text=True).strip() == tree
          (temp/'scope-full-artifact/identity.json').write_text(json.dumps({'head':head,'tree':tree,'parent':'bb160fb68ae5e7f0e7af26a3809323f3c9f6335e'}))
          with open(os.environ['GITHUB_ENV'],'a') as stream:
              stream.write(f'CANDIDATE_DIR={candidate}\nARTIFACT_DIR={temp / "scope-full-artifact"}\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: pr45-current-integration-sources
          path: ${{ runner.temp }}/integration-sources
          retention-days: 3
      - name: Privacy and full unittest discovery
        run: |
          cd "$CANDIDATE_DIR"
          PYTHONPATH=src python -m agentic_os.cli preflight | tee "$ARTIFACT_DIR/preflight.log"
          PYTHONPATH=src python -m unittest discover -s tests -v 2>&1 | tee "$ARTIFACT_DIR/full-tests.log"
      - name: Compilation, migration, identity and clean worktree
        run: |
          cd "$CANDIDATE_DIR"
          PYTHONPYCACHEPREFIX="$RUNNER_TEMP/pycache" PYTHONPATH=src python -m compileall -q scripts src tests
          PYTHONPATH=src python -m unittest tests.test_migrations.MigrationTests.test_packaged_migration_assets_match_repository_assets tests.test_migrations.MigrationTests.test_default_migration_loader_uses_package_resources tests.test_migrations.MigrationTests.test_manifest_is_machine_readable_and_has_pinned_migrations -v 2>&1 | tee "$ARTIFACT_DIR/migration-tests.log"
          git diff --check origin/main...HEAD
          test -z "$(git status --porcelain)"
          test "$(git rev-parse HEAD)" = 'c0cc9d28490657157a9d1cd12675dcc73cd84a2f'
          test "$(git rev-parse HEAD^{tree})" = '5047ea5f43bef41efd0c5a9727d1cf8392bac796'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr45-package-scope-full-verification
          path: ${{ runner.temp }}/scope-full-artifact
          retention-days: 3
