name: PR45 exact integrated candidate verification
on:
  push:
    branches: [fix/pr45-integration-recovery-20260905]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          path: transport
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: e9799b2f49f7f2326f9bcbd6c55cc3bfb20a6b97
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Reproduce and verify exact candidate identity
        working-directory: candidate
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pr45-results"
          python ../transport/.github/pr45-reproduce-candidate.py ../transport/.github | tee "$RUNNER_TEMP/pr45-results/identity.txt"
          python --version >> "$RUNNER_TEMP/pr45-results/identity.txt"
          node --version >> "$RUNNER_TEMP/pr45-results/identity.txt"
      - name: Privacy preflight
        working-directory: candidate
        run: |
          set -euo pipefail
          PYTHONPATH=src python -m agentic_os.cli preflight | tee "$RUNNER_TEMP/pr45-results/privacy.log"
      - name: Full unittest discovery
        working-directory: candidate
        run: |
          set -euo pipefail
          PYTHONPATH=src python -m unittest discover -s tests -v 2>&1 | tee "$RUNNER_TEMP/pr45-results/unittest.log"
      - name: Compile sources and tests
        working-directory: candidate
        run: PYTHONPYCACHEPREFIX="$RUNNER_TEMP/pr45-pycache" PYTHONPATH=src python -m compileall -q scripts src tests
      - name: Migration package parity
        working-directory: candidate
        run: |
          set -euo pipefail
          PYTHONPATH=src python -m unittest -v tests.test_migrations.MigrationTests.test_packaged_migration_assets_match_repository_assets tests.test_migrations.MigrationTests.test_default_migration_loader_uses_package_resources tests.test_migrations.MigrationTests.test_manifest_is_machine_readable_and_has_pinned_migrations 2>&1 | tee "$RUNNER_TEMP/pr45-results/migrations.log"
      - name: Diff and post-test cleanliness
        working-directory: candidate
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 3f381d431442fb2e6d407fae89084ff62d149b33
          test "$(git rev-parse HEAD^{tree})" = 04bf37044b7ae7e1f8ade261a786db9d900ac6dd
          git diff --check origin/main...HEAD
          test -z "$(git status --porcelain)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr45-integrated-3f381d4-verification
          path: ${{ runner.temp }}/pr45-results
          retention-days: 7
  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          path: transport
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: e9799b2f49f7f2326f9bcbd6c55cc3bfb20a6b97
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Reproduce verified tree without executing candidate code
        working-directory: candidate
        run: python ../transport/.github/pr45-reproduce-candidate.py ../transport/.github
      - name: Publish only the verified isolated branch
        working-directory: candidate
        env:
          GH_REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 3f381d431442fb2e6d407fae89084ff62d149b33
          test "$(git rev-parse HEAD^{tree})" = 04bf37044b7ae7e1f8ade261a786db9d900ac6dd
          test -z "$(git status --porcelain)"
          auth="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push "https://github.com/$GH_REPO.git" HEAD:refs/heads/fix/pr45-final-verified-3f381d4
