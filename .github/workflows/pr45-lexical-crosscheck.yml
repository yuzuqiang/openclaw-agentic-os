name: PR45 lexical cross-check
on:
  push:
    branches: [fix/pr45-crosscheck-lexical-20260905]
permissions:
  contents: write
jobs:
  verification:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: src
      PYTHONPYCACHEPREFIX: ${{ runner.temp }}/pycache
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate patch and exact candidate tree
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pr45-lexical-validation"
          python - <<'PY'
          import base64, hashlib, os, pathlib, zlib
          path = pathlib.Path('.github/pr45-lexical-integration.patch.zlib.b64')
          text = path.read_text()
          # Normalize known transcription errors; the pinned digest below is authoritative.
          for bad, good in [('EplGmCb', 'EplmCb'), ('qrG6+79', 'qrG79'), ('VKNZ0WKNh', 'VKNZ0W/h'), ('mlpbazaz29', 'mlpbaz29'), ('FG6Wx4pa8', 'FG6V/4pa8')]:
              text = text.replace(bad, good)
          data = zlib.decompress(base64.b64decode(text, validate=False))
          assert hashlib.sha256(data).hexdigest() == 'a825b3a28e0347abe0eaa623c1b7b3e220324ca1d6ee0e9baa4acfa526f0908c'
          pathlib.Path(os.environ['RUNNER_TEMP'], 'pr45-lexical-validation', 'fix.patch').write_bytes(data)
          path.write_text(base64.b64encode(zlib.compress(data, 9)).decode() + '\n')
          PY
          if ! git diff --quiet -- .github/pr45-lexical-integration.patch.zlib.b64; then
            git add .github/pr45-lexical-integration.patch.zlib.b64
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'chore: normalize checksum-verified lexical patch transport'
            git push origin HEAD:refs/heads/fix/pr45-crosscheck-lexical-20260905
          fi
          git checkout --detach bb160fb68ae5e7f0e7af26a3809323f3c9f6335e
          git apply --check "$RUNNER_TEMP/pr45-lexical-validation/fix.patch"
          git apply "$RUNNER_TEMP/pr45-lexical-validation/fix.patch"
          git add scripts/agentic_os_runtime_source_contract.py tests/test_runtime_lexical_type_boundaries.py
          test "$(git write-tree)" = 76b3b0583e4b94a66fdc04430a5462134eb9b70d
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix: distinguish erased type imports and extends regex contexts'
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/pr45-lexical-validation/identity.txt"
          git bundle create "$RUNNER_TEMP/pr45-lexical-validation/candidate.bundle" HEAD refs/remotes/origin/main
      - name: Privacy preflight
        run: python -m agentic_os.cli preflight | tee "$RUNNER_TEMP/pr45-lexical-validation/preflight.log"
      - name: Focused regressions and real Node witnesses
        run: python -m unittest tests.test_runtime_source_contract_regressions tests.test_openclaw_real_gateway_contract_probe tests.test_runtime_lexical_type_boundaries -v > "$RUNNER_TEMP/pr45-lexical-validation/focused.log" 2>&1
      - name: Full project regression
        run: python -m unittest discover -s tests -v > "$RUNNER_TEMP/pr45-lexical-validation/full.log" 2>&1
      - name: Compile and verify unchanged boundaries
        run: |
          python -m compileall -q scripts src tests
          python -m unittest tests.test_migrations.MigrationTests.test_packaged_migration_assets_match_repository_assets tests.test_migrations.MigrationTests.test_default_migration_loader_uses_package_resources tests.test_migrations.MigrationTests.test_manifest_is_machine_readable_and_has_pinned_migrations -v > "$RUNNER_TEMP/pr45-lexical-validation/migrations.log" 2>&1
          git diff --check refs/remotes/origin/main...HEAD
          test -z "$(git status --porcelain)"
      - name: Publish only isolated verified candidate
        run: git push origin HEAD:refs/heads/fix/pr45-lexical-76b3b0583e4b
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr45-lexical-validation
          path: ${{ runner.temp }}/pr45-lexical-validation
          retention-days: 3
