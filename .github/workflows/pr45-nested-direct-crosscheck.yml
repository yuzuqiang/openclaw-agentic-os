name: PR45 nested direct-call crosscheck
on:
  push:
    branches:
      - fix/pr45-nested-direct-crosscheck-7176833
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: candidate
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          path: audit
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          path: candidate
          ref: bb160fb68ae5e7f0e7af26a3809323f3c9f6335e
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify patch and exact source identity
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pr45-nested-result"
          test "$(git rev-parse HEAD)" = bb160fb68ae5e7f0e7af26a3809323f3c9f6335e
          python - <<'PY'
          import base64, hashlib, os, zlib
          from pathlib import Path
          path = Path(os.environ['GITHUB_WORKSPACE']) / 'audit/.github/pr45-nested-check/patch.zlib.b64'
          patch = zlib.decompress(base64.b64decode(path.read_bytes(), validate=True))
          if hashlib.sha256(patch).hexdigest() != '445ed6bb9d7d7866031127d296dc9b2a3e69edd6581080ee64090cae7e47ddab':
              raise SystemExit('patch digest mismatch')
          (Path(os.environ['RUNNER_TEMP']) / 'pr45-nested-result/repair.patch').write_bytes(patch)
          PY
          git apply --check "$RUNNER_TEMP/pr45-nested-result/repair.patch"
          git apply --index "$RUNNER_TEMP/pr45-nested-result/repair.patch"
          test "$(git write-tree)" = f2dc068ea3165292b297b11be114aa2f2bd097a4
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix: distinguish nested direct calls from capability transfers'
          git rev-parse HEAD HEAD^ HEAD^{tree} | tee "$RUNNER_TEMP/pr45-nested-result/identity.txt"
      - name: Run focused regression and complete probe suites
        run: PYTHONPATH=src python -m unittest tests.test_runtime_nested_direct_calls tests.test_runtime_source_contract_regressions tests.test_openclaw_real_gateway_contract_probe -v 2>&1 | tee "$RUNNER_TEMP/pr45-nested-result/focused.log"
      - name: Full discovery on the exact clean commit
        run: PYTHONPATH=src python -m unittest discover -s tests -v 2>&1 | tee "$RUNNER_TEMP/pr45-nested-result/full.log"
      - name: Privacy, compilation, parity and cleanliness
        run: |
          set -euo pipefail
          PYTHONPATH=src python -m agentic_os.cli preflight
          PYTHONPYCACHEPREFIX="$RUNNER_TEMP/pr45-nested-pycache" PYTHONPATH=src python -m compileall -q scripts src tests
          PYTHONPATH=src python -m unittest tests.test_migrations.MigrationTests.test_packaged_migration_assets_match_repository_assets tests.test_migrations.MigrationTests.test_default_migration_loader_uses_package_resources tests.test_migrations.MigrationTests.test_manifest_is_machine_readable_and_has_pinned_migrations -v
          git diff --check 7ba166efcb1c5cfb658154e1707305db70f5ec94...HEAD
          test "$(git rev-parse HEAD^{tree})" = f2dc068ea3165292b297b11be114aa2f2bd097a4
          test -z "$(git status --porcelain)"
      - name: Publish staging candidate only after verification
        run: git push origin HEAD:refs/heads/fix/pr45-nested-direct-candidate-7176833
      - name: Collect source and test evidence
        if: always()
        run: git bundle create "$RUNNER_TEMP/pr45-nested-result/candidate.bundle" HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr45-nested-direct-verification
          path: ${{ runner.temp }}/pr45-nested-result
          retention-days: 7
