name: PR45 final integration source audit
on:
  push:
    branches:
      - fix/pr45-final-integration-audit-20260905
permissions:
  contents: read
  pull-requests: read
  issues: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Collect source, isolated repair branches, and compact review evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pr45-integration"
          git bundle create "$RUNNER_TEMP/pr45-integration/source.bundle" --all
          git show-ref > "$RUNNER_TEMP/pr45-integration/refs.txt"
          gh api repos/yuzuqiang/openclaw-agentic-os/pulls/45 > "$RUNNER_TEMP/pr45-integration/pr.json"
          gh api --paginate 'repos/yuzuqiang/openclaw-agentic-os/pulls/45/comments?per_page=100' --jq '.[] | {id,body,commit_id,original_commit_id,path,line,created_at,updated_at,html_url,user:.user.login}' > "$RUNNER_TEMP/pr45-integration/review-comments.jsonl"
          gh api --paginate 'repos/yuzuqiang/openclaw-agentic-os/issues/45/comments?per_page=100' --jq '.[] | {id,body,created_at,updated_at,html_url,user:.user.login}' > "$RUNNER_TEMP/pr45-integration/conversation.jsonl"
          gh api --paginate 'repos/yuzuqiang/openclaw-agentic-os/pulls/45/reviews?per_page=100' --jq '.[] | {id,body,commit_id,state,submitted_at,html_url,user:.user.login}' > "$RUNNER_TEMP/pr45-integration/reviews.jsonl"
      - uses: actions/upload-artifact@v4
        with:
          name: pr45-final-integration-source
          path: ${{ runner.temp }}/pr45-integration
          retention-days: 3
