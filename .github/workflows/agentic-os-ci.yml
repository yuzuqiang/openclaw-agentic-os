name: agentic-os-ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  agentic-os-ci:
    name: agentic-os-ci
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS, ARM64, openclaw-agentic-os]
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        run: |
          export UV_CACHE_DIR="${RUNNER_TEMP}/uv-cache"
          export UV_PYTHON_INSTALL_DIR="${RUNNER_TOOL_CACHE}/uv-python"
          uv python install 3.10
          printf 'UV_CACHE_DIR=%s\n' "${UV_CACHE_DIR}" >> "${GITHUB_ENV}"
          printf 'UV_PYTHON_INSTALL_DIR=%s\n' "${UV_PYTHON_INSTALL_DIR}" >> "${GITHUB_ENV}"
          printf 'PYTHON_BIN=%s\n' "$(uv python find 3.10)" >> "${GITHUB_ENV}"

      - name: Privacy preflight
        run: PYTHONPATH=src "${PYTHON_BIN}" -m agentic_os.cli preflight

      - name: Full unittest discovery
        run: PYTHONPATH=src "${PYTHON_BIN}" -m unittest discover -s tests -v

      - name: Compile Python sources
        run: PYTHONPYCACHEPREFIX=${RUNNER_TEMP}/agentic-os-pycache PYTHONPATH=src "${PYTHON_BIN}" -m compileall -q src tests

      - name: Migration/package parity
        run: PYTHONPATH=src "${PYTHON_BIN}" -m unittest tests.test_migrations.MigrationTests.test_packaged_migration_assets_match_repository_assets tests.test_migrations.MigrationTests.test_default_migration_loader_uses_package_resources tests.test_migrations.MigrationTests.test_manifest_is_machine_readable_and_has_pinned_migrations -v

      - name: Whitespace diff check
        run: git diff --check "${{ github.event_name == 'pull_request' && format('origin/{0}...HEAD', github.base_ref) || format('{0}..{1}', github.event.before, github.sha) }}"

      - name: Post-test tracked cleanliness
        run: test -z "$(git status --short)"
