name: PR45 read-only current-head crosscheck source
on:
  push:
    branches: [fix/pr45-crosscheck-d9]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bb160fb68ae5e7f0e7af26a3809323f3c9f6335e
          fetch-depth: 0
          persist-credentials: false
      - name: Retain exact current code and parent for independent review
        run: |
          test "$(git rev-parse HEAD)" = bb160fb68ae5e7f0e7af26a3809323f3c9f6335e
          git bundle create "$RUNNER_TEMP/pr45-bb160fb-source.bundle" HEAD ^871b8242767192cdf2c9f8ba71724b9f346ccc1b
      - uses: actions/upload-artifact@v4
        with:
          name: pr45-bb160fb-source-for-crosscheck
          path: ${{ runner.temp }}/pr45-bb160fb-source.bundle
          retention-days: 1
