name: PR45 isolated source-closure audit
on:
  push:
    branches:
      - fix/pr45-source-closure-audit-20260904
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Package source and reachable history for isolated verification
        run: |
          mkdir -p "$RUNNER_TEMP/pr45-audit"
          git bundle create "$RUNNER_TEMP/pr45-audit/source.bundle" HEAD refs/remotes/origin/main
          git rev-parse HEAD > "$RUNNER_TEMP/pr45-audit/head.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: pr45-audit-source
          path: ${{ runner.temp }}/pr45-audit
          retention-days: 3
      - name: Privacy preflight
        run: PYTHONPATH=src python -m agentic_os.cli preflight
      - name: Full unittest baseline
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Compile sources
        run: PYTHONPYCACHEPREFIX=${RUNNER_TEMP}/agentic-os-pycache PYTHONPATH=src python -m compileall -q scripts src tests
      - name: Verify tracked cleanliness
        run: test -z "$(git status --porcelain)"
