name: PR45 isolated transport reconciliation
on:
  push:
    branches: [fix/pr45-source-closure-reconcile-20260904]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/upload-artifact@v4
        with:
          name: pr45-reconcile-inputs
          path: |
            .github/pr45-repair.patch.gz
            .github/pr45-repair
          include-hidden-files: true
          retention-days: 3
