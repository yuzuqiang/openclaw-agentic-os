name: PR45 isolated source-closure audit
on:
  push:
    branches:
      - fix/pr45-source-closure-audit-20260904
permissions:
  contents: write
defaults:
  run:
    shell: bash
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Reconstruct the exact isolated candidate commit
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pr45-verification"
          python - <<'PY'
          import base64, gzip, hashlib, os
          from pathlib import Path
          encoded = ''.join(Path(f'.pr45-audit/patch-{i}.b64').read_text() for i in range(4))
          patch = gzip.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(patch).hexdigest() == '3dcef816b02e678474ea04b8aa1c757af13232e55d8be1315ba71e49281b48fd'
          Path(os.environ['RUNNER_TEMP'], 'verified.patch').write_bytes(patch)
          PY
          git checkout --detach 871b8242767192cdf2c9f8ba71724b9f346ccc1b
          git apply --check "$RUNNER_TEMP/verified.patch"
          git apply --index "$RUNNER_TEMP/verified.patch"
          test "$(git write-tree)" = 4d35b31b3a0f3f5def0ed68afeb01f725389c263
          cat > "$RUNNER_TEMP/verified-commit" <<'COMMIT'
          tree 4d35b31b3a0f3f5def0ed68afeb01f725389c263
          parent 871b8242767192cdf2c9f8ba71724b9f346ccc1b
          author PR45 Source Closure Audit <audit@users.noreply.github.com> 1788580810 +0000
          committer PR45 Source Closure Audit <audit@users.noreply.github.com> 1788580810 +0000

          fix: account for runtime capability uses and preload closure
          COMMIT
          test "$(git hash-object -t commit -w "$RUNNER_TEMP/verified-commit")" = bb160fb68ae5e7f0e7af26a3809323f3c9f6335e
          git checkout --detach bb160fb68ae5e7f0e7af26a3809323f3c9f6335e
          test -z "$(git status --porcelain)"
          { git rev-parse HEAD; python --version; node --version; } | tee "$RUNNER_TEMP/pr45-verification/identity.txt"
      - name: Privacy preflight
        run: PYTHONPATH=src python -m agentic_os.cli preflight
      - name: Source-closure regressions with actual Node witnesses
        run: PYTHONPATH=src python -m unittest tests.test_runtime_source_contract_regressions -v 2>&1 | tee "$RUNNER_TEMP/pr45-verification/regressions.log"
      - name: Full unittest discovery at the exact clean candidate
        run: PYTHONPATH=src python -m unittest discover -s tests -v 2>&1 | tee "$RUNNER_TEMP/pr45-verification/full-unittest.log"
      - name: Compile all Python sources
        run: PYTHONPYCACHEPREFIX=${RUNNER_TEMP}/agentic-os-pycache PYTHONPATH=src python -m compileall -q scripts src tests
      - name: Migration and packaged schema parity
        run: PYTHONPATH=src python -m unittest tests.test_migrations.MigrationTests.test_packaged_migration_assets_match_repository_assets tests.test_migrations.MigrationTests.test_default_migration_loader_uses_package_resources tests.test_migrations.MigrationTests.test_manifest_is_machine_readable_and_has_pinned_migrations -v
      - name: Whitespace and final tree identity
        run: |
          git diff --check origin/main...HEAD
          test "$(git rev-parse HEAD)" = bb160fb68ae5e7f0e7af26a3809323f3c9f6335e
          test "$(git rev-parse HEAD^{tree})" = 4d35b31b3a0f3f5def0ed68afeb01f725389c263
          test -z "$(git status --porcelain)"
      - name: Publish only the verified isolated branch (never the PR or main)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.https://github.com/.extraheader GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth" git push origin HEAD:refs/heads/fix/pr45-verified-source-closure-20260904
          echo 'Verified candidate: bb160fb68ae5e7f0e7af26a3809323f3c9f6335e' >> "$GITHUB_STEP_SUMMARY"
          echo 'No original PR ref, main ref, production authority, or merge state was changed by this workflow.' >> "$GITHUB_STEP_SUMMARY"
      - name: Retain verification logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr45-verified-source-closure-logs
          path: ${{ runner.temp }}/pr45-verification
          retention-days: 7
