name: PR45 isolated source-closure audit
on:
  push:
    branches: [fix/pr45-source-closure-audit-20260904]
    paths: [.github/pr45-repair/ready.json]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      tree: ${{ steps.prepare.outputs.tree }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Prepare and verify isolated repair tree
        id: prepare
        shell: bash
        run: |
          python - <<'PY'
          import base64, gzip, hashlib, json, os, pathlib, subprocess
          workspace = pathlib.Path(os.environ['GITHUB_WORKSPACE'])
          spec = json.loads((workspace / '.github/pr45-repair/ready.json').read_text())
          assert spec['base'] == '871b8242767192cdf2c9f8ba71724b9f346ccc1b'
          encoded = (workspace / '.github/pr45-repair/repair.patch.gz.b64').read_text().strip()
          patch = gzip.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(patch).hexdigest() == spec['patch_sha256']
          candidate = pathlib.Path(os.environ['RUNNER_TEMP']) / 'pr45-candidate'
          subprocess.run(['git', 'worktree', 'add', '--detach', str(candidate), spec['base']], check=True)
          subprocess.run(['git', 'apply', '--index', '-'], input=patch, cwd=candidate, check=True)
          tree = subprocess.check_output(['git', 'write-tree'], cwd=candidate, text=True).strip()
          assert tree == spec['tree'], (tree, spec['tree'])
          subprocess.run(['git', '-c', 'user.name=github-actions[bot]', '-c', 'user.email=41898282+github-actions[bot]@users.noreply.github.com', 'commit', '-m', 'fix: bind source capabilities, package scopes and preload installation'], cwd=candidate, check=True)
          files = subprocess.check_output(['git', 'diff', '--name-only', spec['base'], 'HEAD'], cwd=candidate, text=True).splitlines()
          allowed = ['scripts/agentic_os_runtime_source_contract.py', 'scripts/openclaw-real-gateway-contract-probe.py', 'tests/test_runtime_source_contract_regressions.py']
          assert sorted(files) == allowed
          artifact = pathlib.Path(os.environ['RUNNER_TEMP']) / 'pr45-publish'
          artifact.mkdir()
          payload = {'base': spec['base'], 'tree': tree, 'files': [{'path': name, 'mode': '100644', 'type': 'blob', 'content': (candidate / name).read_text()} for name in files]}
          (artifact / 'publish.json').write_text(json.dumps(payload))
          with open(os.environ['GITHUB_ENV'], 'a') as out:
              out.write(f'CANDIDATE_DIR={candidate}\n')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f'tree={tree}\n')
          PY
      - name: Privacy preflight
        run: cd "$CANDIDATE_DIR" && PYTHONPATH=src python -m agentic_os.cli preflight
      - name: Full unittest discovery including regression and Node oracle
        run: cd "$CANDIDATE_DIR" && PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Compile sources
        run: cd "$CANDIDATE_DIR" && PYTHONPYCACHEPREFIX=${RUNNER_TEMP}/agentic-os-pycache PYTHONPATH=src python -m compileall -q scripts src tests
      - name: Migration and package parity
        run: |
          cd "$CANDIDATE_DIR"
          PYTHONPATH=src python -m unittest tests.test_migrations.MigrationTests.test_packaged_migration_assets_match_repository_assets tests.test_migrations.MigrationTests.test_default_migration_loader_uses_package_resources tests.test_migrations.MigrationTests.test_manifest_is_machine_readable_and_has_pinned_migrations -v
      - name: Diff and tracked cleanliness
        run: |
          cd "$CANDIDATE_DIR"
          git diff --check origin/main...HEAD
          test -z "$(git status --porcelain)"
          test "$(git rev-parse HEAD^{tree})" = '${{ steps.prepare.outputs.tree }}'
      - uses: actions/upload-artifact@v4
        with:
          name: pr45-validated-source
          path: ${{ runner.temp }}/pr45-publish/publish.json
          retention-days: 3
  publish-candidate:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pr45-validated-source
          path: pr45-publish
      - name: Publish only validated code to an isolated candidate branch
        uses: actions/github-script@v7
        env:
          EXPECTED_TREE: ${{ needs.validate.outputs.tree }}
        with:
          script: |
            const fs = require('fs');
            const p = JSON.parse(fs.readFileSync('pr45-publish/publish.json', 'utf8'));
            const allowed = ['scripts/agentic_os_runtime_source_contract.py', 'scripts/openclaw-real-gateway-contract-probe.py', 'tests/test_runtime_source_contract_regressions.py'];
            if (p.base !== '871b8242767192cdf2c9f8ba71724b9f346ccc1b' || p.tree !== process.env.EXPECTED_TREE || JSON.stringify(p.files.map(f => f.path).sort()) !== JSON.stringify(allowed)) throw new Error('Unexpected repair payload');
            const repo = context.repo;
            const base = await github.rest.git.getCommit({...repo, commit_sha: p.base});
            const tree = await github.rest.git.createTree({...repo, base_tree: base.data.tree.sha, tree: p.files});
            if (tree.data.sha !== p.tree) throw new Error('Published tree differs from tested tree');
            const commit = await github.rest.git.createCommit({...repo, message: 'fix: bind source capabilities, package scopes and preload installation', tree: tree.data.sha, parents: [p.base]});
            const branch = 'fix/pr45-validated-' + p.tree.slice(0, 12);
            await github.rest.git.createRef({...repo, ref: 'refs/heads/' + branch, sha: commit.data.sha});
            core.notice('Validated candidate ' + commit.data.sha + ' on ' + branch);
            await core.summary.addHeading('PR45 validated candidate').addRaw('Commit: `' + commit.data.sha + '`\n\nTree: `' + p.tree + '`\n\nPR #45 has NOT been moved or merged by this workflow.').write();
