name: PR45 final resolution-base matrix
on:
  push:
    branches: [fix/pr45-source-closure-audit-20260904]
    paths: [.github/workflows/pr45-resolution-final-matrix.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Verify all four patch identities
        run: |
          mkdir -p "$RUNNER_TEMP/pr45-final-results"
          cp .github/pr45-resolution-bases.patch.zlib.b64 "$RUNNER_TEMP/pr45-final-results/transport.txt"
          cp .github/pr45-resolution-bases-spread.patch "$RUNNER_TEMP/pr45-final-results/spread.patch"
          cp .github/pr45-resolution-bases-metaobjects.patch "$RUNNER_TEMP/pr45-final-results/metaobjects.patch"
          cp .github/pr45-resolution-bases-portability.patch "$RUNNER_TEMP/pr45-final-results/portability.patch"
          python - <<'PY'
          import base64, hashlib, os, pathlib, zlib
          directory = pathlib.Path(os.environ['RUNNER_TEMP']) / 'pr45-final-results'
          encoded = (directory / 'transport.txt').read_text().strip()
          for old, new in (
              ('muTMzzTMs3dOzzh', 'muTMzzh'),
              ('XM5DYzYViV', 'XM5DYzYyViV'),
              ('B1MRUKFUKFQw', 'B1MRUKFQw'),
          ):
              encoded = encoded.replace(old, new)
          (directory / 'base.patch').write_bytes(zlib.decompress(base64.b64decode(encoded, validate=True)))
          identities = {
              'base.patch': '987d67e390b9ee74e3de45b34a01401f9e3b2b038e10f5d5755354013f7ae645',
              'spread.patch': '1d64e9e6a7b0a09c7676804fb6a0904bc570bf070b3c214cad3e3cc21387083b',
              'metaobjects.patch': 'e7adf8e5a1d10cb70c110c97e466ae68fadc1a52615e3cac3108fe1536bee93c',
              'portability.patch': '89a49835e07fcfe009792c57385ee2e7dc7d063c82dac67e7a23b92ff492d4f2',
          }
          for name, expected in identities.items():
              actual = hashlib.sha256((directory / name).read_bytes()).hexdigest()
              assert actual == expected, (name, actual)
          (directory / 'patch-identities.txt').write_text('\n'.join(f'{value}  {key}' for key, value in identities.items()) + '\n')
          PY
      - name: Build and verify the exact source tree
        run: |
          git checkout --detach bb160fb68ae5e7f0e7af26a3809323f3c9f6335e
          test -z "$(git status --porcelain)"
          for patch in base spread metaobjects portability; do
            git apply --index "$RUNNER_TEMP/pr45-final-results/$patch.patch"
          done
          test "$(git write-tree)" = e18716956d3947bf771929db2cd24e269c0bbe9d
          GIT_AUTHOR_DATE='2026-09-05T05:19:00Z' GIT_COMMITTER_DATE='2026-09-05T05:19:00Z' \
            git -c user.name='PR45 source audit' -c user.email='pr45-audit@users.noreply.github.com' commit -m 'fix: bind loader resolution bases and account for shared URL capabilities'
          git rev-parse HEAD HEAD^ HEAD^{tree} > "$RUNNER_TEMP/pr45-final-results/identity.txt"
          python --version >> "$RUNNER_TEMP/pr45-final-results/identity.txt"
          node --version >> "$RUNNER_TEMP/pr45-final-results/identity.txt"
      - name: Run all original source and probe regressions plus final additions
        run: PYTHONPATH=src python -m unittest tests.test_runtime_resolution_bases tests.test_runtime_source_contract_regressions tests.test_openclaw_real_gateway_contract_probe -v > "$RUNNER_TEMP/pr45-final-results/focused.txt" 2>&1
      - name: Privacy, compilation, parity and clean-worktree gates
        run: |
          PYTHONPATH=src python -m agentic_os.cli preflight | tee "$RUNNER_TEMP/pr45-final-results/privacy.txt"
          PYTHONPYCACHEPREFIX="$RUNNER_TEMP/pr45-final-pycache" PYTHONPATH=src python -m compileall -q scripts src tests
          PYTHONPATH=src python -m unittest \
            tests.test_migrations.MigrationTests.test_packaged_migration_assets_match_repository_assets \
            tests.test_migrations.MigrationTests.test_default_migration_loader_uses_package_resources \
            tests.test_migrations.MigrationTests.test_manifest_is_machine_readable_and_has_pinned_migrations \
            -v > "$RUNNER_TEMP/pr45-final-results/parity.txt" 2>&1
          git diff --check origin/main...HEAD
          test -z "$(git status --porcelain)"
          git bundle create "$RUNNER_TEMP/pr45-final-results/candidate.bundle" HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr45-final-resolution-node${{ matrix.node }}
          path: ${{ runner.temp }}/pr45-final-results
          retention-days: 3
  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: pr45-final-resolution-node22
          path: ${{ runner.temp }}/pr45-published-candidate
      - name: Publish only the cross-version verified isolated branch
        run: |
          git fetch "$RUNNER_TEMP/pr45-published-candidate/candidate.bundle" HEAD
          test "$(git rev-parse FETCH_HEAD^)" = bb160fb68ae5e7f0e7af26a3809323f3c9f6335e
          test "$(git rev-parse FETCH_HEAD^{tree})" = e18716956d3947bf771929db2cd24e269c0bbe9d
          test "$(head -n 1 "$RUNNER_TEMP/pr45-published-candidate/identity.txt")" = "$(git rev-parse FETCH_HEAD)"
          git push origin FETCH_HEAD:refs/heads/fix/pr45-resolution-bases-e18716956d39
