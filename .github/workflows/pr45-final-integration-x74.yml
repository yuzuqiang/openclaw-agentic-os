name: PR45 final integration verification
on:
  push:
    branches: [fix/pr45-final-integration-20260905-x74]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      candidate: ${{ steps.prepare.outputs.candidate }}
      tree: ${{ steps.prepare.outputs.tree }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify transport and prepare exact integration commit
        id: prepare
        env:
          GIT_AUTHOR_NAME: OpenAI
          GIT_AUTHOR_EMAIL: noreply@openai.com
          GIT_COMMITTER_NAME: OpenAI
          GIT_COMMITTER_EMAIL: noreply@openai.com
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pr45-candidate" "$RUNNER_TEMP/pr45-logs"
          python - <<'PY'
          import ast, base64, hashlib, lzma, os, pathlib, subprocess
          base = 'bb160fb68ae5e7f0e7af26a3809323f3c9f6335e'
          parent = 'e9799b2f49f7f2326f9bcbd6c55cc3bfb20a6b97'
          integration_tree = 'a4776c5d9a6d9d65ae70ed5fcaffaa4bd722f959'
          tree = '6327d858f96fcd49caeb5e65031208aee7952d35'
          expected_patch = 'd555a1ec818f7af72939f125ef40c312d4033cec0b8175bf300e2b06c2866f1d'
          expected_followup = '0961bfcf481a9b0351d67adbe1317196fd5e74b1361a884416bec4ee58acb628'
          encoded = ''.join(pathlib.Path(f'.github/pr45-x74-patch.{i}').read_text().strip() for i in range(1, 5))
          patch = lzma.decompress(base64.b64decode(encoded, validate=True))
          followup = lzma.decompress(base64.b64decode(pathlib.Path('.github/pr45-x74-followup.patch.xz.b64').read_text().strip(), validate=True))
          if hashlib.sha256(patch).hexdigest() != expected_patch or hashlib.sha256(followup).hexdigest() != expected_followup:
              raise SystemExit('patch transport digest mismatch')
          changed = set(subprocess.check_output(['git', 'diff', '--name-only', base, parent], text=True).splitlines())
          if changed != {'scripts/agentic_os_runtime_source_contract.py', 'tests/test_runtime_source_contract_regressions.py'}:
              raise SystemExit('unexpected concurrent parent changes: refusing reconstruction')
          previous_tests = subprocess.check_output(['git', 'show', parent + ':tests/test_runtime_source_contract_regressions.py'], text=True)
          previous_names = {n.name for n in ast.walk(ast.parse(previous_tests)) if isinstance(n, ast.FunctionDef) and n.name.startswith('test_')}
          subprocess.run(['git', 'checkout', '--detach', base], check=True)
          subprocess.run(['git', 'apply', '--index', '--whitespace=error', '-'], input=patch, check=True)
          if subprocess.check_output(['git', 'write-tree'], text=True).strip() != integration_tree:
              raise SystemExit('integration differs from validated source tree')
          subprocess.run(['git', 'apply', '--index', '--whitespace=error', '-'], input=followup, check=True)
          if subprocess.check_output(['git', 'write-tree'], text=True).strip() != tree:
              raise SystemExit('final candidate differs from locally validated exact tree')
          current_tests = pathlib.Path('tests/test_runtime_source_contract_regressions.py').read_text()
          current_names = {n.name for n in ast.walk(ast.parse(current_tests)) if isinstance(n, ast.FunctionDef) and n.name.startswith('test_')}
          if not previous_names <= current_names:
              raise SystemExit('concurrent regression tests were lost')
          commit = subprocess.check_output(['git', 'commit-tree', tree, '-p', parent, '-m', 'fix: close PR45 review and cross-module source identity gaps'], text=True).strip()
          subprocess.run(['git', 'checkout', '--detach', commit], check=True)
          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'pr45-candidate'
          (out / 'head.txt').write_text(commit + '\n')
          (out / 'tree.txt').write_text(tree + '\n')
          (out / 'parent.txt').write_text(parent + '\n')
          subprocess.run(['git', 'bundle', 'create', str(out / 'candidate.bundle'), 'HEAD'], check=True)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'candidate={commit}\ntree={tree}\n')
          print(f'candidate={commit}\ntree={tree}\nparent={parent}')
          PY
          git show --no-patch --format=fuller HEAD | tee "$RUNNER_TEMP/pr45-logs/identity.log"
          python --version | tee "$RUNNER_TEMP/pr45-logs/python.log"
          node --version | tee "$RUNNER_TEMP/pr45-logs/node.log"
          git diff --check HEAD^
          test -z "$(git status --porcelain)"
      - uses: actions/upload-artifact@v4
        with:
          name: pr45-x74-exact-candidate
          path: ${{ runner.temp }}/pr45-candidate
          retention-days: 7
      - name: Privacy preflight
        run: |
          set -o pipefail
          PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=src python -m agentic_os.cli preflight | tee "$RUNNER_TEMP/pr45-logs/privacy.log"
      - name: Focused regressions and real Node witnesses
        run: |
          set -o pipefail
          PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=src python -m unittest tests.test_runtime_source_contract_regressions tests.test_runtime_source_native_children tests.test_runtime_module_origin_regressions tests.test_runtime_package_scope_boundaries tests.test_runtime_source_contract_crosscheck tests.test_runtime_review_completion -v 2>&1 | tee "$RUNNER_TEMP/pr45-logs/focused.log"
      - name: Full project test suite
        run: |
          set -o pipefail
          PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=src python -m unittest discover -s tests -v 2>&1 | tee "$RUNNER_TEMP/pr45-logs/full.log"
      - name: Compilation, migrations and diff integrity
        run: |
          set -euo pipefail
          PYTHONPYCACHEPREFIX="$RUNNER_TEMP/pr45-pycache" PYTHONPATH=src python -m compileall -q scripts src tests
          PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=src python -m unittest tests.test_migrations.MigrationTests.test_packaged_migration_assets_match_repository_assets tests.test_migrations.MigrationTests.test_default_migration_loader_uses_package_resources tests.test_migrations.MigrationTests.test_manifest_is_machine_readable_and_has_pinned_migrations -v 2>&1 | tee "$RUNNER_TEMP/pr45-logs/migration-parity.log"
          git diff --check origin/main...HEAD
          test -z "$(git status --porcelain)"
          printf 'PASS\n' > "$RUNNER_TEMP/pr45-logs/result.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr45-x74-verification-logs
          path: ${{ runner.temp }}/pr45-logs
          retention-days: 7
  publish-candidate:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: pr45-x74-exact-candidate
          path: ${{ runner.temp }}/pr45-candidate
      - name: Publish only the verified isolated candidate, never merge or update the PR
        env:
          EXPECTED_HEAD: ${{ needs.verify.outputs.candidate }}
          EXPECTED_TREE: ${{ needs.verify.outputs.tree }}
        run: |
          set -euo pipefail
          test "$(cat "$RUNNER_TEMP/pr45-candidate/head.txt")" = "$EXPECTED_HEAD"
          git bundle verify "$RUNNER_TEMP/pr45-candidate/candidate.bundle"
          git fetch "$RUNNER_TEMP/pr45-candidate/candidate.bundle" HEAD
          test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED_HEAD"
          test "$(git rev-parse "$EXPECTED_HEAD^{tree}")" = "$EXPECTED_TREE"
          git push origin "$EXPECTED_HEAD:refs/heads/fix/pr45-verified-integration-x74-6327d858"
