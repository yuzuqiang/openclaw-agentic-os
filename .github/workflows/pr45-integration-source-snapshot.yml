name: PR45 read-only candidate source snapshot
on:
  push:
    branches: [fix/pr45-audit-46cd0c788361]
    paths: [.github/workflows/pr45-integration-source-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Package relevant exact refs without executing candidate code
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pr45-source-snapshot"
          git for-each-ref --format='%(objectname) %(refname)' 'refs/remotes/origin/fix/pr45*' refs/remotes/origin/phase-b/issue44-live-runtime-readiness-20260824 > "$RUNNER_TEMP/pr45-source-snapshot/refs.txt"
          mapfile -t refs < <(awk '{print $2}' "$RUNNER_TEMP/pr45-source-snapshot/refs.txt")
          test "${#refs[@]}" -gt 1
          git bundle create "$RUNNER_TEMP/pr45-source-snapshot/source.bundle" "${refs[@]}"
          sha256sum "$RUNNER_TEMP/pr45-source-snapshot/source.bundle" > "$RUNNER_TEMP/pr45-source-snapshot/bundle.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: pr45-candidate-source-snapshot
          path: ${{ runner.temp }}/pr45-source-snapshot
          retention-days: 1
