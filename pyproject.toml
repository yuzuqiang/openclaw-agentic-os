[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openclaw-agentic-os"
version = "0.1.0"
description = "Fail-closed Agentic OS control-plane foundations for OpenClaw"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
agentic-os = "agentic_os.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
